<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A stack of business cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efebe4"/><stop offset="1" stop-color="#e2ddd3"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3b3226" flood-opacity=".22"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g filter="url(#s)">
    <rect x="98" y="104" width="196" height="112" rx="4" fill="#fbfaf7" transform="rotate(-11 196 160)"/>
    <rect x="112" y="96" width="196" height="112" rx="4" fill="#f4f1ea" transform="rotate(-3 210 152)"/>
    <g transform="rotate(5 196 150)">
      <rect x="98" y="94" width="196" height="112" rx="4" fill="#1c1c22"/>
      <rect x="116" y="112" width="14" height="14" rx="3" fill="#f4f1ea"/>
      <text x="116" y="176" fill="#f4f1ea" font-family="Georgia, serif" font-size="19" letter-spacing="-.4">Paper &amp; Form</text>
      <rect x="116" y="186" width="70" height="3" rx="1.5" fill="#8b8790"/>
    </g>
  </g>
</svg>
